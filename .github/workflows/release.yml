name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon
        env:
          ARDOOM_STORE_FILE: ${{ secrets.ARDOOM_STORE_FILE }}
          ARDOOM_STORE_PASSWORD: ${{ secrets.ARDOOM_STORE_PASSWORD }}
          ARDOOM_KEY_ALIAS: ${{ secrets.ARDOOM_KEY_ALIAS }}
          ARDOOM_KEY_PASSWORD: ${{ secrets.ARDOOM_KEY_PASSWORD }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          ARDOOM_STORE_FILE: ${{ secrets.ARDOOM_STORE_FILE }}
          ARDOOM_STORE_PASSWORD: ${{ secrets.ARDOOM_STORE_PASSWORD }}
          ARDOOM_KEY_ALIAS: ${{ secrets.ARDOOM_KEY_ALIAS }}
          ARDOOM_KEY_PASSWORD: ${{ secrets.ARDOOM_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 90
